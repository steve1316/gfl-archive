server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;

	# Vite fingerprints these, so they can be cached indefinitely.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	# The vendored Spine runtime is not fingerprinted, so it gets a shorter life.
	location /vendor/ {
		expires 7d;
		add_header Cache-Control "public";
	}

	# A local copy of the art, mounted by `docker-compose.local-assets.yml`. Its own block keeps a missing file a 404, not the app.
	location /gfl-assets/ {
		expires 7d;
	}

	# Routes are real paths, so anything that is not a file falls back to the app and the router renders it.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
