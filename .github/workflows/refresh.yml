name: Refresh game data

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Do everything except pushing to the asset repos and master, and deploying
        type: boolean
        default: false
      date:
        description: Release cutoff as YYYY-MM-DD, defaults to today in UTC
        type: string
        required: false

# One refresh at a time. A second run queues behind the first rather than racing it to master.
concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: read

env:
  US_REPO: https://github.com/gf-data-tools/gf-data-us.git
  CN_REPO: https://github.com/gf-data-tools/gf-data-ch.git

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      work: ${{ steps.plan.outputs.work }}
      date: ${{ steps.date.outputs.date }}
      us: ${{ steps.shas.outputs.us }}
      cn: ${{ steps.shas.outputs.cn }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Both jobs read the cutoff from here, so a refresh that starts after midnight still matches its plan.
      - name: Resolve the release cutoff
        id: date
        env:
          DATE_INPUT: ${{ inputs.date }}
        run: |
          DATE="${DATE_INPUT:-$(date -u +%F)}"
          if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "the date input must be YYYY-MM-DD, got '$DATE'"
            exit 1
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - id: shas
        run: |
          echo "us=$(git ls-remote "$US_REPO" HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "cn=$(git ls-remote "$CN_REPO" HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      # Only the gun table and its names decide which dolls are released: about 2 MB of the 433 MB checkout.
      - name: Fetch the gun table
        env:
          SHA: ${{ steps.shas.outputs.us }}
        run: |
          git init -q "$RUNNER_TEMP/gf-plan"
          cd "$RUNNER_TEMP/gf-plan"
          git remote add origin "$US_REPO"
          git sparse-checkout set --no-cone /stc/gun.json /asset/table/gun.txt
          git fetch -q --depth 1 --filter=blob:none origin "$SHA"
          git checkout -q FETCH_HEAD

      - id: plan
        env:
          SHA: ${{ steps.shas.outputs.us }}
          DATE: ${{ steps.date.outputs.date }}
        run: node tools/data/plan.mjs --gf-data "$RUNNER_TEMP/gf-plan" --latest "$SHA" --date "$DATE"

  refresh:
    needs: plan
    if: needs.plan.outputs.work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write
    env:
      DRY_RUN: ${{ inputs.dry_run == true }}
      US_SHA: ${{ needs.plan.outputs.us }}
      CN_SHA: ${{ needs.plan.outputs.cn }}
      CUTOFF: ${{ needs.plan.outputs.date }}
    # IOPWiki's Cloudflare challenges GitHub's runners, so the import loads its API pages in this browser.
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
        ports:
          - 8191:8191
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/assets/requirements.txt

      - run: pnpm install --frozen-lockfile

      - run: pip install -r tools/assets/requirements.txt

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Move the upstream pins
        run: node tools/data/set_lock.mjs --us "$US_SHA" --cn "$CN_SHA"

      - name: Wait for FlareSolverr
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8191/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "FlareSolverr did not start within 60 seconds" >&2
          exit 1

      - name: Import game data
        env:
          FLARESOLVERR_URL: http://localhost:8191
        run: node tools/data/import.mjs --date "$CUTOFF"

      # When a newly released form genuinely has no asset in the game, add its skill code to `EXPECTED_MISSING_SKILL_CODES` or its item key to
      # `EXPECTED_MISSING_RIGS` in tools/assets/game_bundles.py, otherwise every run stops at this step. HOC items (`hoc_art:<id>`,
      # `hoc_spine:<id>`), fairy items (`fairy_art:<id>`) and Live2D items (`live2d:fairy:<id>`, `live2d:hoc:<id>`,
      # `live2d:skin:<dollId>:<form>:<skinKey>`) have no expected-gap list, so a new HOC, fairy or T-Doll skin Live2D model with a missing
      # bundle stops the run until handled in game_bundles.py.
      - name: Resolve and download new assets
        run: python3 tools/assets/game_bundles.py download --only-missing --gf-data tools/data/.cache/gf-data-us

      - name: Extract new assets
        run: python3 tools/assets/extract_game_assets.py add --staging "$RUNNER_TEMP/staging"

      # The index builders and the animation reader run on the staging folder alone. The animation reader rewrites every entry of the index it
      # is given, so it must never see the committed index without every rig on disk.
      - name: Build partial indexes
        run: |
          S="$RUNNER_TEMP/staging"
          node tools/assets/fix_atlas_pages.mjs --spine "$S/assets/spine"
          python3 tools/assets/build_manifest.py --assets "$S/assets" --out "$S/manifest.partial.json"
          python3 tools/assets/build_spine_index.py --spine "$S/assets/spine" --out "$S/spine-index.partial.json" --hoc-spine "$S/assets/hoc-spine" --hoc-out "$S/hoc-spine-index.partial.json"
          if [ -d "$S/assets/hoc-spine" ]; then
            node tools/assets/fix_atlas_pages.mjs --spine "$S/assets/hoc-spine"
            node tools/assets/add_spine_animations.mjs --spine "$S/assets/hoc-spine" --index "$S/hoc-spine-index.partial.json" --hoc
          fi
          node tools/assets/add_spine_animations.mjs --spine "$S/assets/spine" --index "$S/spine-index.partial.json"
          python3 tools/assets/build_live2d_index.py --staging "$S/assets" --motions tools/data/.cache/gf-data-us/catchdata/fairy_live2d_motions_info.json --out "$S/live2d-index.partial.json" --tdolls-out "$S/live2d-tdolls.partial"

      - name: Merge into the committed indexes
        run: python3 tools/assets/merge_indexes.py --manifest-partial "$RUNNER_TEMP/staging/manifest.partial.json" --spine-partial "$RUNNER_TEMP/staging/spine-index.partial.json" --hoc-spine-partial "$RUNNER_TEMP/staging/hoc-spine-index.partial.json" --live2d-partial "$RUNNER_TEMP/staging/live2d-index.partial.json" --live2d-tdolls-partial "$RUNNER_TEMP/staging/live2d-tdolls.partial"

      # A stale equipment alias fails this step. Unblock it by updating or removing that alias in tools/data/equipment-aliases.json.
      - name: Check the data
        run: node tools/data/check.mjs

      - name: Load the asset repo deploy key
        env:
          ASSETS_KEY: ${{ secrets.ASSETS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ASSETS_KEY" > ~/.ssh/assets_key
          chmod 600 ~/.ssh/assets_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Publish to gfl-archive-assets
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/assets_key -o IdentitiesOnly=yes
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "$DRY_RUN" = true ]; then flags+=(--dry-run); fi
          python3 tools/assets/publish.py add --staging "$RUNNER_TEMP/staging/assets" \
            --remote git@github.com:steve1316/gfl-archive-assets.git --list "$RUNNER_TEMP/assets-paths.json" "${flags[@]}"

      - name: Wait for the new assets to go live
        if: env.DRY_RUN != 'true'
        run: |
          python3 tools/assets/publish.py wait-live --base "$(grep '^VITE_ASSET_BASE_URL=' .env | cut -d= -f2-)" --list "$RUNNER_TEMP/assets-paths.json"

      # The checkouts keep no token, so the push below is the only step that authenticates to this repo. upstream.json is committed but never
      # read by the site, so it alone does not deploy.
      - name: Commit the refreshed data
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add tools/data/upstream.lock.json src/data assets-manifest.json
          if git diff --cached --quiet; then
            echo "nothing changed"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --cached --quiet -- src/data ':!src/data/upstream.json' assets-manifest.json; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
          git commit -q -m "Refresh game data to gf-data-us ${US_SHA:0:8}"
          git show --stat HEAD
          if [ "$DRY_RUN" != true ]; then
            git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:master
          fi

      # A push made with the workflow token does not start deploy.yml on its own, but dispatching it does.
      - name: Deploy
        if: steps.commit.outputs.deploy == 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref master
